<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의준이의 기말 공부방</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#222;--sub:#666;--line:#e5e1d8;--ok:#2f9e44;--no:#e03131;--acc:#7048e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 60px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header.top h1{font-size:22px;margin:0;flex:1}
.btn{border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:bold;cursor:pointer;background:#e9e5db;color:#222;font-family:inherit}
.btn.p{background:var(--acc);color:#fff}.btn.s{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.back{background:none;border:0;font-size:16px;cursor:pointer;color:var(--sub);padding:4px 0;font-family:inherit}
.dday{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;border:2px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dday .big{font-size:30px;font-weight:900;color:#e8590c}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.steps span{background:#f1efe8;border-radius:8px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.sub{background:var(--card);border-radius:18px;padding:16px;border:3px solid var(--line);cursor:pointer;text-align:left;font-family:inherit;font-size:16px}
.sub .ic{font-size:34px}.sub .nm{font-size:22px;font-weight:900}
.bar{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.small{font-size:13px;color:var(--sub)}
.panel{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;border:2px solid var(--line)}
.unit h3{margin:0 0 8px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:20px;padding:20px 18px;border:3px solid var(--line);min-height:300px}
.card h2{margin:0 0 10px;font-size:22px}
.card ul{padding-left:20px;margin:0}.card li{margin-bottom:10px}
.card b{background:linear-gradient(transparent 60%,#ffe066 60%)}
.tip{background:#ebfbee;border-radius:10px;padding:8px 12px;margin-top:10px;color:#2b8a3e;font-weight:bold}
.ox{border-top:2px dashed var(--line);margin-top:14px;padding-top:12px}
.oxq{margin:8px 0}.oxb{display:flex;gap:8px;margin-top:4px}
.oxb button{flex:0 0 64px;font-size:22px;padding:6px}
.fb{font-size:15px;margin-top:4px;font-weight:bold}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0;flex-wrap:wrap}.dots i{width:10px;height:10px;border-radius:50%;background:#ddd}.dots i.on{background:var(--acc)}.dots i.done{background:#94d82d}
.nav{display:flex;justify-content:space-between;gap:8px}
.q{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;border:2px solid var(--line)}
.q.right{border-color:#8ce99a;background:#f4fff5}.q.wrong{border-color:#ffa8a8;background:#fff5f5}
.qt{font-weight:bold;margin-bottom:6px}
.pas{background:#fffbe6;border:2px solid #f0d878;border-radius:12px;padding:10px 12px;margin:14px 0 6px;font-size:15.5px;white-space:pre-wrap}
.pas .pt{font-weight:bold;margin-bottom:4px;white-space:normal}
.box{border:1.5px solid #999;border-radius:8px;padding:6px 10px;margin:6px 0;white-space:pre-wrap;font-size:15.5px;background:#fff}
.fig{overflow-x:auto;text-align:center;margin:6px 0}.fig svg{max-width:100%;height:auto;background:#fff}
.ch label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:9px;cursor:pointer;margin:3px 0;border:1.5px solid transparent}
.ch label:hover{background:#f3f0ff}.ch input{margin-top:6px;transform:scale(1.25)}
.ch label.sel{border-color:var(--acc);background:#f3f0ff}
.ch label.ans{border-color:var(--ok);background:#ebfbee}
input.t,textarea{width:100%;font-size:17px;padding:8px 10px;border:2px solid #ccc;border-radius:10px;font-family:inherit}
.res{font-size:15px;margin-top:8px;padding:8px 10px;border-radius:10px;background:#f8f9fa}
.score{font-size:44px;font-weight:900;text-align:center;color:var(--acc)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.05}
.frac sup{border-bottom:1.5px solid #000;padding:0 3px}.frac sub{padding:0 3px}
.tag{font-size:12px;border:1px solid var(--no);color:var(--no);border-radius:5px;padding:0 4px;margin-left:4px}
.sticky{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.badge{display:inline-block;background:#f1efe8;border-radius:8px;padding:1px 8px;font-size:13px;margin-left:4px}
.center{text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = [{"s": {"id": "kor", "name": "국어", "icon": "📖", "color": "#e8590c", "range": "3~5단원 (국어 112~147쪽, 180~251쪽 / 매체 단원·국어활동 제외)"}, "units": [{"no": 3, "name": "의견을 모아서", "cards": [{"title": "토의란 무엇일까?", "points": ["<b>토의</b>: 여러 사람이 <b>공동의 문제</b>를 해결하려고 의견을 나누어 <b>가장 좋은 해결 방법</b>을 찾는 말하기", "<b>토론</b>은 찬성·반대로 나뉘어 겨루는 것, <b>토의</b>는 함께 좋은 방법을 찾는 것 — 서로 달라요!", "토의 주제 예: “복도에서 뛰는 친구를 줄이려면 어떻게 해야 할까?”, “학급 문고를 어떻게 관리할까?”"], "ox": [["토의는 찬성편과 반대편으로 나뉘어 이기고 지는 말하기이다.", false, "그것은 토론이에요. 토의는 함께 해결 방법을 찾아요."], ["토의 주제는 여러 사람이 함께 해결해야 할 문제가 좋다.", true, "공동의 문제가 토의 주제로 알맞아요."]], "tip": null}, {"title": "토의 절차 4단계", "points": ["① <b>토의 주제 정하기</b> → ② <b>의견 마련하기</b> → ③ <b>의견 모으기</b> → ④ <b>의견 결정하기</b>", "의견 마련하기: 주제에 맞는 의견과 <b>이유(근거)</b>를 미리 준비해요.", "의견 모으기: 사회자 진행에 따라 의견을 발표하고, <b>질문</b>하며 의견을 살펴봐요.", "의견 결정하기: 기준에 따라 따져 보고 가장 알맞은 의견을 정해요(필요하면 다수결)."], "ox": [["“의견 모으기”는 “의견 마련하기”보다 먼저 한다.", false, "마련하기 → 모으기 순서예요."], ["사회자가 “지금까지 나온 의견을 정리하겠습니다”라고 말하는 것은 의견 모으기와 관련 있다.", true, "발표된 의견을 모으고 정리하는 단계예요."]], "tip": "외우기: “주제 → 마련 → 모으기 → 결정” (주·마·모·결)"}, {"title": "의견을 결정하는 기준", "points": ["① <b>토의 주제에 알맞은가?</b>", "② <b>실천할 수 있는가?</b> (돈·시간이 너무 많이 들면 곤란)", "③ <b>문제를 해결하는 데 효과가 있는가?</b>", "④ 많은 사람에게 도움이 되는가? 문제점(단점)은 없는가?"], "ox": [["“우리 반 전원이 매일 학교 청소를 3시간씩 한다”는 실천 가능한 의견이다.", false, "실천하기 어려운 의견이에요."], ["의견을 결정할 때 그 의견의 단점도 생각해 본다.", true, "좋은 점과 문제점을 함께 따져요."]], "tip": null}, {"title": "토의할 때의 질문과 태도", "points": ["질문하는 까닭: 의견의 <b>이유</b>가 무엇인지, <b>단점</b>은 없는지, <b>실천할 수 있는지</b> 확인하려고", "예) “그 의견을 실천하려면 돈이 많이 들지 않을까요?” → 실천 가능성·단점을 묻는 질문", "태도: 친구의 말을 <b>끝까지 듣기</b>, <b>말 끊지 않기</b>, 의견과 이유를 함께 말하기, 다른 의견 <b>존중</b>하기", "사회자의 역할: 토의 주제 알리기, 발언 순서 정하기, 의견 정리하기"], "ox": [["궁금한 것이 있으면 친구가 말하는 중간에 바로 끊고 질문한다.", false, "끝까지 듣고 사회자의 허락을 받아 질문해요."], ["친구의 의견을 바탕으로 새로운 생각을 덧붙여 말할 수 있다.", true, "좋은 토의 태도예요."]], "tip": null}, {"title": "제안하는 글의 짜임", "points": ["<b>제안하는 글</b>: 문제를 해결하기 위해 어떤 일을 하자고 의견을 내는 글", "꼭 들어갈 내용 3가지: <b>문제 상황</b> / <b>제안하는 내용</b> / <b>제안하는 이유</b>", "<b>제목</b>은  null}, {"title": "낱말의 뜻 짐작하기", "points": ["모르는 낱말은 <b>앞뒤 문장</b>을 살펴 뜻을 짐작하고, <b>국어사전</b>으로 확인해요.", "예) 수거: 거두어 감 / 추궁: 잘못한 일을 엄하게 따져서 밝힘 / 어이없다: 일이 너무 뜻밖이어서 기가 막히다", "짐작한 뜻을 낱말 대신 넣어 읽어 보고 자연스러운지 확인해요."], "ox": [["‘폐의약품 수거’에서 ‘수거’는 거두어 간다는 뜻이다.", true, ""]], "tip": null}]}, {"no": 5, "name": "오가는 마음", "cards": [{"title": "온라인 대화의 특성", "points": ["얼굴을 보지 않고 <b>글·이모티콘</b>으로 대화해요.", "<b>시간·장소에 상관없이</b>, <b>여러 사람과 동시에</b> 대화할 수 있어요.", "대화 내용이 <b>기록으로 남고</b>, 다른 사람에게 <b>빠르게 퍼질</b> 수 있어요.", "표정·목소리가 보이지 않아 <b>오해</b>가 생기기 쉬워요.", "직접 만나서 하는 대화: 표정·몸짓·목소리로 마음을 전하고, 바로 반응을 볼 수 있어요."], "ox": [["온라인 대화는 내용이 기록으로 남지 않는다.", false, "기록이 남고 퍼질 수 있어요."], ["직접 만나서 하는 대화는 표정과 몸짓으로 마음을 전할 수 있다.", true, ""]], "tip": null}, {"title": "온라인 대화 예절", "points": ["바르고 고운 말 쓰기, 지나친 <b>줄임말·은어·비속어</b> 쓰지 않기", "상대의 기분을 생각하며 쓰기, 보내기 전에 <b>한 번 더 읽어 보기</b>", "다른 사람의 <b>개인 정보·사진</b>을 허락 없이 올리지 않기, 확인되지 않은 소문 퍼뜨리지 않기", "단체 대화방에서 친구 따돌리지 않기, 너무 늦은 시간에 연락하지 않기", "대화방에 <b>초대하기 전에 상대에게 먼저 물어보기</b>, 자료를 올리기 전에 <b>사실인지 확인</b>하기"], "ox": [["친구 사진은 재미있으면 허락 없이 단체 대화방에 올려도 된다.", false, "반드시 허락을 받아야 해요."], ["메시지를 보내기 전에 상대가 기분 나쁘지 않을지 다시 읽어 본다.", true, ""]], "tip": null}, {"title": "편지의 짜임", "points": ["① <b>받는 사람</b> → ② <b>첫인사</b> → ③ <b>전하고 싶은 말</b> → ④ <b>끝인사</b> → ⑤ <b>쓴 날짜</b> → ⑥ <b>쓴 사람</b>", "받는 사람: 친구에게는 “○○에게”, 웃어른께는 “할머니께”처럼 <b>“께”</b>를 써요.", "쓴 사람: 웃어른께는 “손자 ○○ <b>올림</b>”, “<b>드림</b>”을 써요.", "편지를 다 쓴 뒤 덧붙일 말이 있으면 <b>추신</b>(덧붙이는 말)을 써요.", "첫인사: 날씨·안부 인사 / 끝인사: “안녕히 계세요”, “건강하세요”"], "ox": [["편지에서 쓴 날짜는 첫인사 바로 다음에 쓴다.", false, "끝인사 다음에 써요."], ["할아버지께 쓰는 편지의 끝에는 “○○ 올림”이라고 쓸 수 있다.", true, ""]], "tip": "외우기: “받·첫·전·끝·날·쓴”"}, {"title": "편지봉투 쓰기와 우편번호", "points": ["<b>보내는 사람</b>(왼쪽 위): 주소, 이름(웃어른께 보낼 때 “○○ <b>올림</b>”), 우편번호", "<b>받는 사람</b>(오른쪽 아래): 주소, 이름 뒤에 “<b>님</b>”(또는 “귀하”), 우편번호", "<b>우편번호</b>: 우편물을 쉽게 분류하려고 지역마다 매긴 <b>다섯 자리</b> 번호", "편지의 좋은 점: 마음을 차분히 정리해 진솔하게 전할 수 있고, 받은 사람이 오래 간직할 수 있어요."], "ox": [["편지봉투의 받는 사람 이름 뒤에는 “올림”을 쓴다.", false, "받는 사람에게는 “님”, 보내는 사람에게 “올림”을 써요."], ["우편번호는 우편물을 쉽게 분류하려고 매긴 번호이다.", true, ""]], "tip": null}, {"title": "마음을 전하는 글", "points": ["전할 수 있는 마음: <b>고마움</b>, <b>미안함</b>, <b>축하</b>, <b>위로</b>, <b>격려</b>", "쓰는 방법: 읽을 사람 정하기 → 전하고 싶은 마음과 <b>그 까닭(있었던 일)</b> 떠올리기 → 알맞은 형식으로 쓰기", "있었던 일을 구체적으로 쓰면 마음이 더 잘 전해져요."], "ox": [["마음을 전하는 글에는 그런 마음이 든 까닭이 되는 일을 함께 쓰면 좋다.", true, ""]], "tip": null}, {"title": "높임 표현", "points": ["<b>-시-</b> 넣기: 할머니께서 웃으<b>시</b>다 / <b>께서</b>: 아버지<b>께서</b> 오셨다", "높임 낱말: 밥→<b>진지</b>, 나이→<b>연세</b>, 집→<b>댁</b>, 말→<b>말씀</b>, 생일→<b>생신</b>, 자다→<b>주무시다</b>, 있다→<b>계시다</b>, 아프다→<b>편찮으시다</b>, 먹다→<b>드시다/잡수시다</b>", "대상을 높이기: 주다→<b>드리다</b>, 묻다→<b>여쭙다</b>, 데리다→<b>모시다</b>, 보다→<b>뵙다</b>", "듣는 사람 높이기: “-습니다”, “-요”", "틀린 예) “할머니, 밥 먹어.”(X) → “할머니, 진지 드세요.”(O)"], "ox": [["“선생님께 물어보았다.”를 높이면 “선생님께 여쭈어보았다.”이다.", true, ""], ["“할아버지가 집에 있다.”는 높임 표현을 바르게 쓴 문장이다.", false, "“할아버지께서 댁에 계신다.”가 알맞아요."]], "tip": null}, {"title": "지시 표현과 접속 표현", "points": ["<b>지시 표현</b>: 이것·그것·저것, 여기·거기·저기 / <b>이</b>: 말하는 사람 가까이, <b>그</b>: 듣는 사람 가까이(또는 앞에서 말한 것), <b>저</b>: 둘 다에게서 멀리", "<b>접속 표현</b>(문장 잇기): <b>그리고</b>(덧붙임), <b>그러나·하지만</b>(반대), <b>그래서</b>(원인→결과), <b>왜냐하면</b>(이유), <b>그런데</b>(화제 바꾸기), <b>또는</b>(고르기)", "예) 비가 왔다. <b>그래서</b> 우산을 썼다. / 비가 왔다. <b>그러나</b> 우산이 없었다."], "ox": [["“열심히 연습했다. ( ) 대회에서 상을 받았다.”의 ( )에는 “그래서”가 알맞다.", true, "원인 → 결과예요."], ["멀리 있는 산을 가리킬 때는 “이 산”이라고 한다.", false, "둘 다에게서 멀면 “저 산”이에요."]], "tip": null}]}], "passages": {"k1a": {"title": "다음은 하늘이네 반 토의 장면입니다.", "text": "사회자: 오늘의 토의 주제는 “급식을 남기지 않으려면 어떻게 해야 할까?”입니다. 의견을 말씀해 주십시오.\n하늘: 먹을 만큼만 받는 “조절 배식”을 하면 좋겠습니다. 왜냐하면 자기가 먹을 수 있는 양을 받으면 남기는 음식이 줄어들기 때문입니다.\n사회자: 질문이 있는 학생은 말씀해 주십시오.\n도윤: ㉠ 조절 배식을 하면 배식 시간이 너무 오래 걸리지 않을까요?\n하늘: 처음에는 조금 늦을 수 있지만, 익숙해지면 시간이 줄어들 것이라고 생각합니다.\n서연: 급식을 다 먹은 날 학급 달력에 칭찬 스티커를 붙이면 좋겠습니다. 스티커가 모이면 다 함께 보람을 느낄 수 있기 때문입니다.\n사회자: 지금까지 두 가지 의견이 나왔습니다. 이제 어떤 의견이 좋을지 기준을 세워 정해 보겠습니다."}, "k1b": {"title": "다음 글을 읽고 물음에 답하시오.", "text": "(가) 학교 도서관 의자를 바꾸어 주세요\n교장 선생님, 안녕하세요? 저는 4학년 2반 김하준입니다.\n(나) 요즘 학교 도서관 의자 가운데 다리가 흔들리는 의자가 많습니다. 지난주에는 한 친구가 흔들리는 의자에 앉았다가 넘어질 뻔했습니다.\n(다) 흔들리는 의자를 튼튼한 새 의자로 바꾸어 주시면 좋겠습니다.\n(라) 그러면 친구들이 다치지 않고 안전하게 책을 읽을 수 있습니다. 또 도서관에 오고 싶은 친구들도 더 많아질 것입니다.\n제 의견을 꼭 검토해 주시면 감사하겠습니다."}, "k1c": {"title": "다음 글을 읽고 물음에 답하시오.", "text": "여름밤 강가에서 반짝반짝 빛나는 곤충을 본 적이 있나요? 바로 반딧불이입니다.\n반딧불이는 배 끝에 빛을 내는 부분이 있습니다. 반딧불이는 이 빛으로 짝을 찾고 서로 신호를 주고받습니다.\n반딧불이의 애벌레는 맑은 물에 사는 다슬기를 먹고 자랍니다. 그래서 반딧불이는 물이 깨끗한 곳에서만 볼 수 있습니다.\n그런데 요즘에는 반딧불이를 보기가 점점 어려워지고 있습니다. 밤에도 환한 불빛과 더러워진 물 때문입니다. 반딧불이가 다시 돌아올 수 있도록 우리 주변의 물을 깨끗하게 지켜야 합니다."}, "k1d": {"title": "다음 편지를 읽고 물음에 답하시오.", "text": "(가) 사랑하는 할머니께\n(나) 할머니, 그동안 안녕하셨어요? 날씨가 많이 추워졌는데 감기에 걸리지는 않으셨는지 걱정돼요.\n(다) 지난 주말에 할머니 댁에서 김장을 도와드렸던 일이 아직도 생각나요. 처음에는 배추에 양념을 바르는 일이 어려웠는데, 할머니께서 웃으시며 천천히 알려 주셔서 끝까지 해낼 수 있었어요. 할머니, 정말 고맙습니다.\n(라) 겨울 방학에 또 찾아뵐게요. 늘 건강하세요.\n(마) 20○○년 12월 1일\n(바) 손자 민준 올림"}, "k2a": {"title": "다음은 초록이네 반 토의 장면입니다.", "text": "사회자: 오늘 토의 주제는 “쉬는 시간에 교실을 조용하게 하려면 어떻게 해야 할까?”입니다.\n지호: 교실에서 보드게임 대신 책 읽기를 하면 좋겠습니다. 책을 읽으면 큰 소리를 낼 일이 줄어들기 때문입니다.\n사회자: 지호 학생의 의견에 질문이 있나요?\n유나: ㉠ 책 읽기를 싫어하는 친구들은 어떻게 하나요?\n지호: 만화책이나 그림책처럼 좋아하는 책을 고를 수 있게 하면 될 것 같습니다.\n민서: “목소리 신호등”을 칠판에 붙이면 좋겠습니다. 빨간불일 때는 작은 소리로 말하기로 약속하면 모두가 목소리 크기를 쉽게 알 수 있기 때문입니다.\n태오: ㉡ 그냥 쉬는 시간을 없애면 좋겠습니다.\n사회자: 나온 의견들을 정리해 보겠습니다."}, "k2b": {"title": "다음 글을 읽고 물음에 답하시오.", "text": "(가) 공원 놀이터에 그늘막을 설치해 주세요\n구청장님, 안녕하세요? 저는 햇살초등학교 4학년 이서아입니다.\n(나) 우리 동네 공원 놀이터에는 햇빛을 가릴 곳이 없습니다. 그래서 여름에는 미끄럼틀이 너무 뜨거워 아이들이 놀지 못하고 그냥 돌아갑니다.\n(다) 놀이터에 그늘막을 설치해 주시면 좋겠습니다.\n(라) 그늘막이 있으면 더운 날에도 아이들이 안전하게 놀 수 있습니다. 또 함께 온 어른들도 그늘에서 쉴 수 있습니다.\n우리 동네 아이들을 위해 제 제안을 들어주시면 감사하겠습니다."}, "k2c": {"title": "다음 글을 읽고 물음에 답하시오.", "text": "도토리는 참나무 종류의 열매입니다. 단단한 껍질 속에 영양분이 가득 들어 있습니다.\n다람쥐는 가을이 되면 도토리를 땅속 여기저기에 묻어 둡니다. 먹을 것이 부족한 겨울에 꺼내 먹기 위해서입니다.\n그런데 다람쥐는 묻어 둔 도토리를 모두 찾아 먹지는 못합니다. 잊어버린 도토리는 봄이 되면 싹을 틔워 새로운 참나무로 자랍니다.\n이처럼 다람쥐는 자신도 모르는 사이에 숲에 나무를 심는 일을 합니다. 그러므로 산에서 도토리를 함부로 주워 가지 않는 것이 좋겠습니다."}, "k2d": {"title": "다음 편지를 읽고 물음에 답하시오.", "text": "(가) 보고 싶은 수아에게\n(나) 수아야, 안녕? 전학 간 학교에는 잘 적응하고 있니?\n(다) 지난번 체육 시간에 내가 피구를 하다가 너에게 공을 세게 던져서 정말 미안해. 그때 바로 사과하지 못해서 계속 마음에 걸렸어. 앞으로는 친구 마음을 먼저 생각하는 내가 될게.\n(라) 새 학교에서도 즐겁게 지내. 안녕.\n(마) 20○○년 11월 20일\n(바) 너의 친구 하윤이가"}, "k3a": {"title": "다음은 별빛이네 반 토의 장면입니다.", "text": "사회자: 오늘 토의 주제는 “학급 문고의 책을 깨끗하게 쓰려면 어떻게 해야 할까?”입니다.\n준서: 책을 빌려 갈 때 이름과 날짜를 적는 “대출 장부”를 만들면 좋겠습니다. 누가 책을 빌려 갔는지 알 수 있어서 책을 더 조심해서 쓸 것이기 때문입니다.\n사회자: 질문이 있나요?\n나은: ㉠ 대출 장부는 누가 관리하나요?\n준서: 일주일씩 돌아가며 “도서 도우미”를 정하면 됩니다.\n은우: 찢어진 책을 고치는 “책 병원” 상자를 만들면 좋겠습니다. 책이 망가졌을 때 바로 고칠 수 있기 때문입니다.\n사회자: 두 의견 모두 좋습니다. 이제 ㉡ 의견을 정할 기준을 세워 보겠습니다."}, "k3b": {"title": "다음 글을 읽고 물음에 답하시오.", "text": "(가) 횡단보도 앞에 “노란 발자국”을 그려 주세요\n시장님, 안녕하세요? 저는 바다초등학교 4학년 박도현입니다.\n(나) 우리 학교 앞 횡단보도에서는 신호를 기다리는 어린이들이 차도 쪽으로 너무 가까이 서 있는 경우가 많습니다. 그래서 차가 지나갈 때 위험한 순간이 자주 생깁니다.\n(다) 횡단보도 앞 안전한 곳에 노란 발자국을 그려 주시면 좋겠습니다.\n(라) 노란 발자국이 있으면 어린이들이 그 위에서 기다리게 되어 차도와 거리를 둘 수 있습니다. 또 운전자도 어린이가 있다는 것을 쉽게 알아차릴 수 있습니다.\n어린이들의 안전을 위해 꼭 검토해 주세요."}, "k3c": {"title": "다음 글을 읽고 물음에 답하시오.", "text": "여러분은 하루에 물을 얼마나 마시나요? 우리 몸의 절반 이상은 물로 이루어져 있습니다.\n물은 우리 몸에서 여러 가지 일을 합니다. 먼저, 물은 몸의 온도를 알맞게 지켜 줍니다. 더울 때 땀을 흘리면 몸의 열이 밖으로 나갑니다.\n또, 물은 몸에 필요한 영양소를 온몸 구석구석으로 실어 나릅니다. 그리고 몸속의 필요 없는 것들을 밖으로 내보내는 일도 합니다.\n따라서 목이 마르지 않더라도 물을 조금씩 자주 마시는 습관을 기르는 것이 좋습니다."}, "k3d": {"title": "다음 편지를 읽고 물음에 답하시오.", "text": "(가) 존경하는 담임 선생님께\n(나) 선생님, 안녕하세요? 아침저녁으로 바람이 차가워졌어요.\n(다) 이번 학예회에서 제가 피아노 연주를 하다가 실수했을 때, 선생님께서 “괜찮아, 끝까지 잘했어.”라고 말씀해 주셔서 정말 힘이 났어요. 덕분에 다음에는 더 자신 있게 연주할 수 있을 것 같아요.\n(라) 선생님, 늘 건강하세요.\n(마) 20○○년 11월 28일\n(바) 제자 서윤 올림"}}, "exams": {"1": [{"v": 1, "u": 3, "t": "mc", "q": "이 토의의 주제로 알맞은 것은 무엇입니까?", "ch": ["급식 시간을 늘리려면?", "급식을 남기지 않으려면 어떻게 해야 할까?", "좋아하는 급식 메뉴는?", "칭찬 스티커를 어디에 붙일까?", "배식 당번을 어떻게 정할까?"], "a": 2, "exp": "사회자가 처음에 토의 주제를 알려 주었어요.", "box": null, "pas": "k1a", "fig": null, "multi": false}, {"v": 1, "u": 3, "t": "mc", "q": "㉠은 어떤 점을 확인하려는 질문입니까?", "ch": ["의견이 주제에 맞는지", "의견의 단점(문제점)이 없는지", "의견을 낸 사람이 누구인지", "토의 순서가 맞는지", "사회자가 누구인지"], "a": 2, "exp": "배식 시간이 오래 걸릴 수 있다는 단점을 묻는 질문이에요.", "box": null, "pas": "k1a", "fig": null, "multi": false}, {"v": 1, "u": 3, "t": "mc", "q": "사회자의 마지막 말 다음에 이어질 토의 절차는 무엇입니까?" se}, {"v": 3, "u": 4, "t": "mc", "q": "㉠의 뜻으로 알맞은 것과, 이 글에서 짐작할 수 있는 서준이의 성격을 바르게 짝 지은 것은 무엇입니까?", "ch": ["㉠ 칭찬함 – 욕심이 많다", "㉠ 따져서 밝힘 – 솔직하다", "㉠ 머뭇거리며 망설임 – 솔직하게 말하기를 어려워한다", "㉠ 크게 화냄 – 용감하다", "㉠ 빠르게 달림 – 활발하다"], "a": 3, "exp": "“우물쭈물”은 말이나 행동을 분명히 하지 못하고 망설이는 모양이에요. 친구 눈치를 보며 말을 못 하는 성격을 짐작할 수 있어요.", "box": "“서준아, 네 그림도 이번 대회에 내 볼래?” 선생님의 말씀에 서준이는 ㉠우물쭈물하며 친구들 눈치만 살폈다. 정말 내고 싶었지만, 친구들이 비웃을까 봐 “아, 아니에요…….” 하고 작은 소리로 대답했다.", "pas": null, "fig": null, "multi": false}, {"v": 3, "u": 5, "t": "mc", "q": "서윤이가 선생님께 전하고 싶은 마음은 무엇입니까?", "ch": ["미안함", "서운함", "고마움", "축하", "걱정"], "a": 3, "exp": "용기를 주신 선생님께 고마운 마음을 전했어요.", "box": null, "pas": "k3d", "fig": null, "multi": false}, {"v": 3, "u": 5, "t": "mc", "q": "편지의 짜임에 맞게 (마)와 (바)에 들어갈 내용을 바르게 짝 지은 것은 무엇입니까?", "ch": ["(마) 받는 사람 – (바) 첫인사", "(마) 쓴 날짜 – (바) 쓴 사람", "(마) 끝인사 – (바) 쓴 날짜", "(마) 쓴 사람 – (바) 쓴 날짜", "(마) 첫인사 – (바) 끝인사"], "a": 2, "exp": "끝인사 다음에 쓴 날짜, 쓴 사람이 와요.", "box": null, "pas": "k3d", "fig": null, "multi": false}, {"v": 3, "u": 5, "t": "sa", "q": "(다)에서 “말”을 높여 이르는 낱말을 찾아 쓰시오.", "a": ["말씀"], "exp": "“말씀해 주셔서”에서 찾을 수 있어요.", "box": null, "pas": "k3d", "fig": null, "suf": ""}, {"v": 3, "u": 5, "t": "mc", "q": "지시 표현을 알맞게 쓴 것은 무엇입니까?", "ch": ["(내 손에 든 연필을 보며) “저 연필은 내 거야.”", "(멀리 보이는 산을 가리키며) “이 산은 높구나.”", "(친구가 들고 있는 책을 보며) “그 책 재미있니?”", "(내가 입은 옷을 보며) “저 옷은 새 옷이야.”", "(바로 앞의 의자를 보며) “저기 앉아.”"], "a": 3, "exp": "듣는 사람 가까이 있는 것은 “그”로 가리켜요.", "box": null, "pas": null, "fig": null, "multi": false}, {"v": 3, "u": 5, "t": "mc", "q": "다음 친구가 지켜야 할 온라인 대화 예절로 알맞은 것을 두 가지 고르시오.", "ch": ["바르고 고운 말을 사용하기", "대화방에 초대할 때 상대에게 먼저 물어보기", "자료를 올리기 전에 내용이 사실인지 확인하기", "늦은 시간에 연락하지 않기", "친구의 사진을 허락 없이 올리지 않기"], "a": [2, 3], "exp": "말도 없이 대화방에 초대했고, 사실인지 모르는 소문을 올렸어요.", "box": "하람: (친구들에게 묻지 않고 반 친구 다섯 명을 새 대화방에 초대하며) “얘들아, 들었어? 다음 주에 시험이 없어진대! 확실한지는 모르겠지만 일단 알려 줄게.”", "pas": null, "fig": null, "multi": true}]}}, {"s": {"id": "math", "name": "수학", "icon": "📐", "color": "#7048e8", "range": "3~5단원 (수학 51~130쪽, 수학익힘 35~80쪽)"}, "units": [{"no": 3, "name": "소수의 덧셈과 뺄셈", "cards": [{"title": "소수 두 자리 수", "points": ["<span class=\"frac\"><sup>1</sup><sub>100</sub></span> = <b>0.01</b> (영 점 영일) &nbsp; <span class=\"frac\"><sup>37</sup><sub>100</sub></span> = <b>0.37</b> (영 점 삼칠)", "<b>2.45</b> 읽기: “이 점 사오” (소수점 아래는 숫자만 하나씩 읽어요!)", "2.45 = 2 + 0.4 + 0.05 → 4는 <b>소수 첫째 자리</b>(0.4), 5는 <b>소수 둘째 자리</b>(0.05)", "2.45는 0.01이 <b>245개</b>인 수"], "ox": [["3.47은 “삼 점 사십칠”이라고 읽는다.", false, "“삼 점 사칠”이라고 읽어요."], ["<span class=\"frac\"><sup>9</sup><sub>100</sub></span>은 0.09이다.", true, ""]], "tip": null}, {"title": "소수 세 자리 수", "points": ["<span class=\"frac\"><sup>1</sup><sub>1000</sub></span> = <b>0.001</b> (영 점 영영일)", "<b>1.234</b>: 1은 일의 자리(1), 2는 소수 첫째(0.2), 3은 소수 둘째(0.03), 4는 소수 셋째 자리(0.004)", "1.234는 0.001이 <b>1234개</b>인 수"], "ox": [["5.678에서 8은 0.008을 나타낸다.", true, ""], ["0.001이 52개인 수는 0.52이다.", false, "0.052예요."]], "tip": null}, {"title": "소수의 크기 비교", "points": ["① <b>자연수 부분</b>부터 비교 → ② 같으면 <b>소수 첫째 자리</b> → ③ 둘째 자리 → ④ 셋째 자리", "예) 2.38 &lt; 2.4 (첫째 자리 3 &lt; 4) — 자릿수가 많다고 큰 게 아니에요!", "소수 끝자리의 0은 생략할 수 있어요: <b>0.50 = 0.5</b>, 1.200 = 1.2"], "ox": [["3.09는 3.1보다 크다.", false, "첫째 자리 0 < 1이라 3.09가 작아요."], ["0.70과 0.7은 같은 수이다.", true, ""]], "tip": "자리를 맞춰 세로로 써 보면 비교가 쉬워요."}, {"title": "10배, 100배, 1/10, 1/100", "points": ["<b>10배</b> 하면 소수점이 <b>오른쪽으로 한 칸</b>: 0.35 → 3.5", "<b>100배</b> 하면 오른쪽으로 <b>두 칸</b>: 0.35 → 35", "<span class=\"frac\"><sup>1</sup><sub>10</sub></span> 하면 소수점이 <b>왼쪽으로 한 칸</b>: 4.2 → 0.42", "<span class=\"frac\"><sup>1</sup><sub>100</sub></span> 하면 왼쪽으로 <b>두 칸</b>: 4.2 → 0.042"], "ox": [["2.7의 10배는 27이다.", true, ""], ["6의 <span class=\"frac\"><sup>1</sup><sub>100</sub></span>은 0.6이다.", false, "0.06이에요."]], "tip": null}, {"title": "소수의 덧셈", "points": ["<b>소수점끼리 맞추어</b> 세로로 써요.", "같은 자리끼리 더하고, 10이 되면 <b>받아올림</b>해요.", "답에도 소수점을 그대로 내려 찍어요.", "예) 2.47 + 3.86 = <b>6.33</b> / 1.5 + 0.75 = 1.50 + 0.75 = <b>2.25</b>"], "ox": [["0.8 + 0.45 = 0.53이다.", false, "소수점을 맞추면 0.80 + 0.45 = 1.25예요."]], "tip": null}, {"title": "소수의 뺄셈", "points": ["<b>소수점끼리 맞추어</b> 세로로 쓰고, 빈자리에는 <b>0</b>을 채워요.", "같은 자리끼리 뺄 수 없으면 윗자리에서 <b>받아내림</b>해요.", "예) 5 − 1.37 = 5.00 − 1.37 = <b>3.63</b> / 7.2 − 3.58 = 7.20 − 3.58 = <b>3.62</b>", "검산: 뺄셈 결과 + 빼는 수 = 처음 수"], "ox": [["4.3 − 1.25 = 3.05이다.", true, "4.30 − 1.25 = 3.05"]], "tip": null}, {"title": "문장제 풀이 순서", "points": ["① 구하려는 것 찾기 → ② 식 세우기 → ③ 소수점 맞춰 계산 → ④ <b>단위</b> 붙여 답 쓰기", "“남은 것” → 뺄셈 / “모두” → 덧셈 / “얼마나 더” → 뺄셈", "예) 주스 2L 중 0.65L와 0.8L를 마심 → 2 − 0.65 − 0.8 = <b>0.55(L)</b>"], "ox": [], "tip": null}]}, {"no": 4, "name": "사각형", "cards": [{"title": "수직과 수선", "points": ["두 직선이 만나서 이루는 각이 <b>직각</b>일 때, 두 직선은 서로 <b>수직</b>이에요.", "한 직선에 수직인 직선을 그 직선에 대한 <b>수선</b>이라고 해요.", "수선 긋기: <b>삼각자</b>의 직각 부분이나 <b>각도기</b>(90°)를 이용해요."], "ox": [["두 직선이 만나서 이루는 각이 직각이면 서로 수직이다.", true, ""], ["수선은 한 직선에 평행한 직선이다.", false, "수직인 직선이에요."]], "tip": null}, {"title": "평행과 평행선", "points": ["서로 만나지 않는 두 직선을 <b>평행</b>하다고 하고, 그 두 직선을 <b>평행선</b>이라고 해요.", "한 직선에 수직인 두 직선은 서로 평행해요.", "평행선은 아무리 길게 늘여도 <b>만나지 않아요</b>."], "ox": [["평행선은 길게 늘이면 언젠가 만난다.", false, "절대 만나지 않아요."]], "tip": null}, {"title": "평행선 사이의 거리", "points": ["평행선의 한 직선에서 다른 직선에 <b>수선을 그었을 때 그 수선의 길이</b>", "평행선 사이의 거리는 <b>어디에서 재어도 같아요</b>. 수선의 길이가 <b>가장 짧아요</b>.", "직선 가, 나, 다가 평행할 때: (가~다 거리) = (가~나 거리) + (나~다 거리)"], "ox": [["평행선 사이의 거리는 재는 곳에 따라 달라진다.", false, "어디서 재어도 같아요."]], "tip": null}, {"title": "사다리꼴", "points": ["<b>평행한 변이 있는</b> 사각형 (평행한 변이 한 쌍만 있어도 사다리꼴)", "평행사변형, 마름모, 직사각형, 정사각형도 모두 <b>사다리꼴</b>이에요 (평행한 변이 있으니까!)"], "ox": [["평행사변형은 사다리꼴이라고 할 수 있다.", true, ""]], "tip": null}, {"title": "평행사변형", "points": ["<b>마주 보는 두 쌍의 변이 서로 평행한</b> 사각형", "성질 ① <b>마주 보는 두 변의 길이가 같아요</b>.", "성질 ② <b>마주 보는 두 각의 크기가 같아요</b>.", "성질 ③ <b>이웃한 두 각의 크기의 합은 180°</b>예요.", "둘레 = (한 변 + 이웃한 변) × 2"], "ox": [["평행사변형에서 한 각이 70°이면 이웃한 각은 110°이다.", true, "180 − 70 = 110"], ["평행사변형은 네 각이 모두 직각이다.", false, "그건 직사각형이에요."]], "tip": null}, {"title": "마름모", "points": ["<b>네 변의 길이가 모두 같은</b> 사각형", "마주 보는 두 쌍의 변이 평행하고, <b>마주 보는 각의 크기가 같아요 }, {"v": 3, "u": 5, "t": "mc", "q": "자료를 수집하여 꺾은선그래프로 나타내는 순서로 알맞은 것은 무엇입니까?", "ch": ["㉠ → ㉢ → ㉡ → ㉣", "㉢ → ㉠ → ㉡ → ㉣", "㉠ → ㉡ → ㉢ → ㉣", "㉣ → ㉢ → ㉡ → ㉠", "㉡ → ㉠ → ㉢ → ㉣"], "a": 1, "exp": "주제 → 수집 → 그래프 → 해석", "box": "㉠ 조사할 주제 정하기 ㉡ 꺾은선그래프로 나타내기\n㉢ 자료 수집하기 ㉣ 그래프를 보고 해석하기", "pas": null, "fig": null, "multi": false}]}}, {"s": {"id": "soc", "name": "사회", "icon": "🏙️", "color": "#1971c2", "range": "1~2단원 (사회 6~101쪽)"}, "units": [{"no": 1, "name": "민주주의와 자치", "cards": [{"title": "민주주의의 의미", "points": ["사회에는 다양한 사람들이 모여 살아서 생각이 달라 문제가 생기기도 해요. 구성원들은 이런 <b>공동의 문제</b>를 의논하고 협력하며 해결해요.", "<b>민주주의</b>: 구성원들의 <b>다양한 의견을 반영</b>하여 사회 공동의 문제에 관한 <b>의사 결정을 하는 방식</b>", "민주주의 사회에서는 구성원 <b>모두</b>가 인간으로서 <b>존중</b>받고, <b>평등</b>한 입장에서 의견을 내고 <b>자유</b>롭게 행동할 수 있어요.", "일상 속 민주주의: 학급 회의로 급식 먹는 순서 정하기, 가족회의로 여행 장소 정하기, 주민 회의로 축제 장소 정하기", "<b>자치</b>: 자기 일을 스스로 다스림. 학교도 학생·교사·학부모가 함께 생활하는 <b>사회</b>예요."], "ox": [["민주주의 사회에서는 일부 사람들만 의견을 내고 자유롭게 행동할 수 있다.", false, "구성원 모두가 평등하게 의견을 낼 수 있어요."], ["가족회의로 주말 여행 장소를 정하는 것은 민주주의를 실천하는 모습이다.", true, ""]], "tip": null}, {"title": "민주주의를 실천하는 태도", "points": ["공동의 문제를 민주적으로 해결하려면 <b>충분한 대화</b>가 필요해요.", "상대방의 의견을 <b>존중</b>하고, 서로 <b>배려</b>하며 <b>양보하고 타협</b>하는 태도", "상대방 의견의 <b>옳고 그름</b>과 <b>장단점</b>을 생각하며 해결 방안을 찾는 태도", "함께 결정한 해결 방안은 구성원 모두가 <b>적극적으로 실천</b>해요(내가 반대했던 의견이 뽑혀도!).", "충분히 의견을 나눈 뒤에는 <b>투표</b>로 정하기도 해요. 이때도 다른 의견을 존중해요."], "ox": [["내 의견이 옳다고 생각하면 다른 사람의 의견은 듣지 않고 내 의견만 강하게 주장한다.", false, ""], ["민주적으로 갈등을 해결하려면 다른 사람의 의견을 무조건 따라야 한다.", false, "옳고 그름과 장단점을 따져 봐요."], ["함께 결정한 일은 구성원 모두가 적극적으로 실천해야 한다.", true, ""]], "tip": null}, {"title": "학교생활 속 민주주의", "points": ["학생들은 대표를 뽑아 <b>학생 자치회</b>를 구성해요. 학생 자치회는 학생 의견을 학교에 전달하고 학교 일을 민주적으로 해결해요.", "학생 자치회 임원 <b>선거</b>: 후보의 공약을 듣고 기표소에서 질서 있고 공정하게 투표", "<b>학생 참여 예산제</b>: 학교생활에 필요한 사업을 학생들이 제안하면 예산을 지원해 학생 스스로 기획·운영하는 제도 (예: 우산 빗물 제거기 설치)", "<b>예산</b>: 어떤 일을 하기 위해 필요한 돈을 미리 계획해 둔 것", "부산 기장군 <b>대변 초등학교</b> 학생들은 학생 자치회 공약 → 편지·서명 운동 → 교명 변경 추진 위원회 → 민주적 절차를 거쳐 <b>용암 초등학교</b>로 이름을 바꿨어요."], "ox": [["학교에서는 학생, 교사, 학부모가 학교의 여러 가지 일을 함께 의논하며 해결한다.", true, ""], ["학교에서는 구성원들이 민주주의를 실천하는 모습을 찾아볼 수 없다.", false, ""]], "tip": null}, {"title": "학교 문제를 민주적으로 해결하는 과정", "points": ["① <b>해결하고 싶은 일 확인하기</b> (예: 놀이터 바닥이 패어 위험함)", "② <b>해결 방안을 탐색하고 민주적인 방법으로 결정하기</b> (의견 나누기, 설문 조사, 회의)", "③ <b>해결 방안을 실천하고 결과 확인하기</b> (놀이터를 바꾸고 이용 규칙을 홍보)", "해결 방안을 먼저 정하는 것이 아니라 <b>해결하고 싶은 일부터 확인</b>해요."], "ox": [["학교에 해결하고 싶은 일이 있을 때는 해결 방안을 먼저 결정해야 한다.", false, "해결하고 싶은 일을 먼저 확인해요."]], "tip": "“확인 → 탐색·결정 → 실천·확인”"}, {"title": "주민 자치", "points": ["<b>주민 자치</b>: 주민이 지역의 <b>주인</b>으로서 지역의 일에 <b>참여</b>하여 함께 문제를 해결해 나가는 것", "<b>주민 자치회</b>: 지역 주민을 <b>대표하는 기구</b>로, 주민 자치 활동을 운영하고 지원해요(행정 복지 센터에서 신청, 주민이면 누구나 참여).", "예) 동 주민 자치회가 어두운 골목길에 태양광 가로등 설치 / 주민들이 힘을 합쳐 지역 축제 열기 / 지역 예산 세우는 일에 참여", "주민들이 주민 자치에 적극적으로 참여할 때 지역에서 <b>민주주의를 실천</b>할 수 있어요."], "ox": [["주민 자치회는 지역 주민을 대표하는 기구이다.", true, ""], ["주민 자치는 공공 기관만 지역의 일을 결정하는 것이다.", false, "주민이 주인으로서 참여해요."]], "tip": null}, {"title": "주민 참여의 중요성과 방법", "points": ["중요한 까닭: 지역에서 일어나는 일은 주민의 생활에 큰 영향을 주고, <b>지역 주민이 지역을 가장 잘 알기 때문</b>이에요. 주민 참여가 활발하면 지역의 일을 <b>민주적으로 해결</b>하고 <b>더 살기 좋은 지역</b>으로 발전해요.", "참여 방법: <b>주민 투표</b>(투표판, 누리 소통망), <b>주민 참여 예산</b>, 주민 회의, 자원봉사, 주민 소모임, 캠페인, 서명 운동, <b>공공 기관</b>(시·군·구청, 행정 복지 센터)에 의견 전달하기", "<b>공공 기관</b>: 주민 전체의 이익을 위해 국가나 지방 자치 단체가 세워 관리하는 곳", "주민 자치에 참여하면 지역의 구성원으로서 <b>만족감</b>을 느낄 수 있어요. 주민 힘만으로 어려우면 공공 기관에 도움을 요청해요."], "ox": [["지역 주민이 지역을 잘 알기 때문에 주민 참여가 중요하다.", true, ""], ["주민 투표는 지역 곳곳의 투표판이나 누리 소통망으로도 할 수 있다.", true, ""]], "tip": null}, {"title": "우리 지역의 주민 자치 사례 조사하기", "points": ["조사 방법: <b>지역 신문</b> 찾아보기, <b>지역 게시판</b> 살펴보기, <b>지역 주민 면담</b>하기, 공공 기관 <b>누리집</b>에서 검색하기, <b>공공 기관 방문</b>하기(미리 연락하고 보호자와 함께)", "조사가 끝나면 <b>조사 보고서</b>(조사 목적·날짜·방법·내용·알게 된 점)를 쓰고 발표해요.", "사례: 불편한 보행로 정비, 건물 벽에 벽화 그리기, 위험한 공터를 쉼터로 바꾸기, 학생들이 만든 안전 지도로 통학로에 안전장치 설치(생활 실험실)"], "ox": [["주민 자치 사례를 조사한 뒤에는 조사 계획서를 쓴다.", false, "조사 보고서를 써요."], ["공공 기관을 방문해서 주민 자치 사례를 조사할 수 있다.", true, ""]], "tip": null}]}, {"no": 2, "name": "지역 문제를 해결하고 지역을 알리는 노력", "cards": [{"title": "지역 문제란?", "points": ["<b>지역 문제</b>: 지역 주민의 생활을 <b>불편</b>하게 하거나 주민들 사이에 <b>갈등</b>을 일으키는 문제", "종류: <b>교통 혼잡</b>, <b>안전</b> 문제, <b>환경 오염</b>, <b>주차</b> 문제, <b>쓰레기</b> 문제, 도서관 같은 <b>시설 부족</b>, <b>문화유산 훼손</b>(옛 장성이 무너진 채 방치), 큰비에 도로가 잠겨 마을이 고립되는 문제", "지역 문제는 <b>지역마다 다르게</b> 나타날 수 있어요. 시청 누리집의 생활 불편 신고 게시판에 올리기도 해요.", "개인의 고민(예: 점심 메뉴 고민)은 지역 문제가 아니에요."], "ox": [["“오늘 저녁 메뉴 고민”은 지역 문제이다.", false, "개인 문제예요."], ["불법 주차는 주민의 생활을 불편하게 하는 지역 문제이다.", true, ""]], "tip": null}, {"title": "지역 문제를 찾는 방법", "points": ["<b>지역 신문·뉴스</b> 살펴보기", "<b>시·도청(구청) 누리집</b>에서 찾아보기", "<b>지역 주민과 면담</b>하기", "<b>지역을 직접 둘러보며</b> 찾아보기 (사진 찍기)", "조사한 자료(신문 기사, <b>그래프</b>, 표, 설문 조사 결과)를 분석해 문제의 <b>원인</b>을 찾아요.", "예) 주차 문제의 원인: 자동차 수에 비해 주차 공간이 부족함, 불법 주차의 피해를 잘 모름, 주차 규칙을 지키려는 마음 부족"], "ox": [["지역 주민에게 직접 여쭈어보는 것은 지역 문제를 찾는 방법이다.", true, ""]], "tip": null}, {"title": "지역 문제 해결 과정", "points": ["① <b>문제 확인하기</b> → ② <b>원인 알아보기</b> → ③ <b>해결 방안 찾기</b> → ④ <b>해결 방안 실천하기</b>", "원인을 알아본 <b>뒤에</b> 해결 방안을 찾아요(순서 바꾸면 틀려요!).", "해결 방안 정하기: 각 방안의 <b>장단점을 비교</b>하고 <b>대화와 타협</b>으로 의견을 조정해 알맞은 방안을 정해요.", "평가 기준: <b>효과가 큰가?</b> <b>비용이 적게 드나?</b> <b>실천할 수 있나?</b>"], "ox": [["해결 방안을 정할 때는 내 의견이 뽑혔는지가 가장 중요하다.", false, "가장 합리적인 방안을 고르는 것이 중요해요."], ["해결 방안의 장점과 단점을 비교해 보고 결정한다.", true, ""]], "tip": "“확인 → 원인 → 방안 → 실천”"}, {"title": "지역 문제를 해결하는 사람들", "points": ["지역 문제는 어느 한 사람의 노력만으로 해결할 수 없어요. <b>지역 주민</b>과 <b>공공 기관</b>이 힘을 모아야 해요.", "주민은 공공 기관에 해결 방안을 <b>제안</b>해요 → <b>제안서</b>(제목, 보낼 곳, 제안한 까닭, 주요 제안)를 시청·구청 누리집에 올리기", "주차 문제 해결 예: 저녁 시간대(오후 6시 이후) <b>공공 기관 주차장 개방</b>, 불법 주차의 위험을 알리는 <b>캠페인</b>·<b>공익 광고</b>, 주차 공간 확보를 위한 <b>서명 운동</b>, 단속 카메라를 늘려 달라고 게시판에 글 올리기", "<b>공유</b>로 해결하기: <b>공유 주차장</b>(비어 있는 시간에 다른 사람이 사용), <b>공공 자전거</b>(교통 혼잡·대기 오염 줄이기)"], "ox": [["공공 기관만 노력하면 지역 문제를 해결할 수 있다.", false, "주민과 공공 기관이 함께 노력해야 해요."], ["공유 주차장은 주차 공간 부족 문제를 해결하는 데 도움이 된다.", true, ""]], "tip": null}, {"title": "지역의 자랑거리", "points": ["지역의 <b>자연환경</b>(산·바다·강), <b>역사</b>(유적지·문화유산), <b>문화</b>(축제·공연), <b>생산물</b>(특산물), 인물 등과 관련 있는 자랑거리", "자랑거리를 보면 그 지역의 <b>독특한 점이나 특징</b>을 알 수 있어요.", "부산 예) 자연환경: 해운대·광안리 해수욕장, 낙동강, 금정산 / 역사: 동래읍성, 범어사, 연산동 고분군 / 문화: <b>부산국제영화제</b>, <b>부산불꽃축제</b>, 자갈치축제, 감천문화마을 / 생산물: 어묵, 기장 미역·멸치, 대저 토마토", "부산의 대표 다리: <b>광안대교</b> / 부산 갈매기 캐릭터: <b>부기</b>"], "ox": [["지역의 자랑거리를 보면 그 지역의 특징을 알 수 있다.", true, ""], ["환경 오염은 지역의 자랑거리이다.", false, ""]], "tip": null}, {"title": "지역을 알리는 노력", "points": ["<b>지역 축제</b> 열기 (문화·생산물 알리기)", "<b>박람회</b> 열기 (생산물·산업 알리기)", "<b>직거래 장터</b>: 생산자와 소비자가 직접 만나 생산물을 사고파는 곳 → 지역 <b>생산물</b>을 알림", "<b>자연환경</b>: 자연환경을 이용한 <b>관광 상품</b> 개발 (예: 보령 머드 축제 – 깨끗한 갯벌의 진흙)", "<b>역사</b>: 역사를 보존하고 알리는 축제·전시회·체험 프로그램 (예: 통영 – 한산도 앞바다에서 이순신 장군이 일본군을 무찌른 일, 거북선 견학)", "<b>문화</b>: 지역 고유의 문화 축제 (예: 당진 기지시 줄다리기 – 500년 전통, 유네스코 인류 무형 문화유산)", "<b>생산물</b>: 박람회(김제 쌀), 직거래 장터(진안 인삼), 축제(장수 사과), 체험 행사(전주 부채 만들기)", "경주시가 관광 안내 자료를 무료로 보내 주는 까닭: 지역을 알려 관광객이 오면 <b>지역 경제에 도움</b>이 되기 때문", "알리면 좋은 점: 지역을 알리고 <b>발전</b>시킬 수 있음, 지역 경제 도움, 주민 자부심"], "ox": [["직거래 장터는 지역의 생산물을 알리는 방법이다.", true, ""], ["지역을 알리면 관광객이 줄어들어 지역 경제에 도움이 된다.", false, "관광객이 늘어나 도움이 돼요."]], "tip": null}, {"title": "지역을 대표하는 것 조사하기", "points": ["조사 방법: <b>시·군·구청 누리집</b> 방문, <b>관광 안내 자료</b>(지도·안내서) 살펴보기, <b>직접 방문</b>(현장 체험), 지역을 잘 아시는 분께 <b>여쭈어보기</b>, 책·신문 찾아보기", "그냥 상상해서 쓰는 것은 조사가 아니에요.", "소개 자료 만들기: <b>만화</b>(그림+말풍선), <b>포스터</b>(그림·사진+설명 문구), <b>안내도</b>(지역 <b>백지도</b>에 자랑거리 위치를 색칠하고 설명 자료를 붙여 선으로 이음), <b>누리 소통망</b>(글·사진+해시태그, 사진 출처 표시), 신문, 안내 책자", "순서: 소개할 자랑거리 정하기 → 소개 방법 정하기 → 소개 자료 만들기 → 소개하기"], "ox": [["친구들과 자유롭게 상상해 보는 것은 지역을 대표하는 것을 조사하는 알맞은 방법이다.", false, "실제 자료를 찾아야 해요."]], "tip": null}]}], "passages": {"s1a": {"title": "다음은 4학년 1반의 학급 회의 장면입니다.", "text": "회장: 지금부터 “2학기 1인 1역할 정하는 방법”을 주제로 회의를 시작하겠습니다.\n도윤: 1학기에 칭찬 스티커를 많이 받은 학생이 먼저 역할을 고르면 좋겠습니다.\n수아: 저는 반대합니다. 그 친구들은 이미 칭찬을 받았으니, 공평하게 제비뽑기로 정하면 좋겠습니다.\n태민: 회의 같은 거 하지 말고 그냥 한 사람한테 다 맡기자.\n하은: 모두 원하는 역할을 먼저 고르고, 겹치는 사람끼리만 가위바위보로 정하면 어떨까요?\n도윤: 제 처음 의견을 고쳐서, 칭찬 스티커를 적게 받은 친구에게 먼저 고를 기회를 주는 방법을 제안합니다.\n회장: 충분히 의견을 나눈 것 같습니다. 가장 좋은 방법을 투표로 정하겠습니다."}, "s2a": {"title": "다음은 ○○동의 주민 이야기입니다.", "text": "○○동에는 어린이 놀이터가 하나밖에 없어서 주말마다 아이들이 놀 곳이 부족했습니다. 주민들은 ㉠ 주민 회의를 열어 이 문제를 이야기하고, 놀이터를 더 만들어 달라는 ㉡ 서명을 모았습니다. 또 구청 ㉢ 누리집에 의견을 올렸습니다. 그리고 내년에 할 지역 사업을 ㉣ 지역 곳곳의 투표판과 누리 소통망으로 투표해 정했는데, “새 놀이터 만들기”가 가장 많은 표를 받았습니다."}, "s3a": {"title": "다음 신문 기사를 읽고 물음에 답하시오.", "text": "○○ 신문 20△△년 △월 △일\n“밤마다 쿵쿵” 공사장 소음에 주민 불편\n□□동의 한 공사장에서 밤늦게까지 공사가 이어지면서 주민들이 잠을 이루지 못하고 있다. 주민들은 “밤에도 공사를 하는 까닭을 모르겠다.”라며 불편을 호소했다. 구청은 주민 의견을 모아 해결 방안을 찾겠다고 밝혔다."}}, "exams": {"1": [{"v": 1, "u": 1, "t": "mc", "q": "민주주의의 의미로 알맞은 것은 무엇입니까?", "ch": ["힘이 센 사람이 공동의 문제를 혼자 결정하는 방식", "구성원들의 다양한 의견을 반영하여 사회 공동의 문제에 관한 의사 결정을 하는 방식", "나이가 많은 사람의 의견만 따르는 방식", "일부 사람만 자유롭게 행동하는 방식", "문제가 생기면 모른 척하는 방식"], "a": 2, "exp": "", "box": null, "pas": null, "fig": null, "multi": false}, {"v": 1, "u": 1, "t": "sa", "q": "“자기 일을 스스로 다스림”이라는 뜻의 낱말을 두 글자로 쓰시오.", "a": ["자치"], "exp": "학교 자치, 주민 자치의 “자치”예요.", "box": null, "pas": null, "fig": null, "suf": ""}, {"v": 1, "u": 1, "t": "mc", "q": "이 회의에서 마지막에 의견을 정하는 방법으로 쓴 것은 무엇입니까?", "ch": ["제비뽑기", "가위바위보", "투표", "회장 혼자 결정", "선생님께 맡기기"], "a": 3, "exp": "충분히 의견을 나눈 뒤 투표로 정했어요.", "box": null, "pas": "s1a", "fig": null, "multi": false}, {"v": 1, "u": 1, "t": "mc", "q": "이 회의에서 민주주의를 실천하는 태도와 거리가 <u>먼</u> 말을 한 사람은 누구입니까?", "ch": ["도윤", "수아", "태민", "하은", "회장"], "a": 3, "exp": "태민이는 회의를 하지 말고 한 사람에게 다 맡기자고 해서 다른 사람을 존중하지 않았어요.", "box": null, "pas": "s1a", "fig": null, "multi": false}, {"v": 1, "u": 1, "t": "mc", "q": "다음 친구가 보여 준 태도로 알맞은 것은 무엇입니까?", "ch": ["상대방 의견의 옳고 그름과 장단점을 생각하는 태도", "다른 사람의 의견을 무조건 따르는 태도", "내 의견만 강하게 주장하는 태도", "회의에 관심을 갖지 않는 태도", "결정된 일을 지키지 않는 태도"], "a": 1, "exp": "", "box": "하늘: “제비뽑기는 공평하다는 좋은 점이 있지만, 궂은일을 하고 싶은 친구의 뜻을 무시할 수 있다는 단점도 있어. 함께 따져 보자.”", "pas": null, "fig": null, "multi": false}, {"v": 1, "u": 1, "t": "mc", "q": "주민이 지역의 일에 참여하는 방법으로 알맞지 <u>않은</u> 것은 무엇입니까?", "ch": ["주민 투표에 참여한다.", "지역 축제 자원봉사를 한다.", "구청 누리집에 의견을 올린다.", "주민 자치회 활동에 참여한다.", "지역의 일에 관심을 두지 않는다."], "a": 5, "exp": "", "box": null, "pas": null, "fig": null, "mu  위치와 특징을 한눈에 소개할 수 있어요.", "box": null, "pas": null, "fig": null, "multi": false}, {"v": 3, "u": 2, "t": "mc", "q": "지역의 자랑거리를 보고 알 수 있는 점으로 알맞은 것은 무엇입니까?", "ch": ["지역의 해결해야 할 문제", "지역의 독특한 점이나 특징", "지역 주민의 이름", "지역의 쓰레기 양", "지역의 범죄 수"], "a": 2, "exp": "", "box": null, "pas": null, "fig": null, "multi": false}, {"v": 3, "u": 2, "t": "mc", "q": "다음 중 지역의 “문화”와 관련 있는 것끼리 묶은 것은 무엇입니까?", "ch": ["낙동강, 금정산", "부산국제영화제, 자갈치축제", "동래읍성, 범어사", "기장 미역, 대저 토마토", "해운대 해수욕장, 낙동강"], "a": 2, "exp": "", "box": null, "pas": null, "fig": null, "multi": false}, {"v": 3, "u": 2, "t": "mc", "q": "지역을 알리는 노력과 그 예를 바르게 짝 지은 것은 무엇입니까?", "ch": ["지역 캐릭터 – 부기", "직거래 장터 – 부산국제영화제", "박람회 – 동래읍성", "관광 상품 – 공사장 소음", "축제 – 불법 주차"], "a": 1, "exp": "", "box": null, "pas": null, "fig": null, "multi": false}, {"v": 3, "u": 2, "t": "es", "q": "지역 축제를 열면 지역에 좋은 점을 한 가지 쓰시오.", "a": ["관광객이 늘어나 지역 경제가 발전한다. / 지역을 널리 알릴 수 있다. / 주민이 자부심을 느끼고 화합한다."], "exp": "하나만 맞게 쓰면 정답이에요.", "box": null, "pas": null, "fig": null}, {"v": 3, "u": 2, "t": "mc", "q": "지역 문제를 해결하는 과정에서 “원인 알아보기” 단계에 해당하는 것은 무엇입니까?", "ch": ["“우리 동네에 쓰레기가 많다”라는 것을 알게 되었다.", "쓰레기통이 부족하고 분리배출 방법을 모르는 사람이 많다는 것을 조사했다.", "쓰레기통을 더 설치하기로 결정했다.", "쓰레기 줍기 캠페인을 실천했다.", "여러 해결 방안을 제시했다."], "a": 2, "exp": "왜 문제가 생겼는지 알아보는 것이 원인 파악이에요.", "box": null, "pas": null, "fig": null, "multi": false}]}}, {"s": {"id": "sci", "name": "과학", "icon": "🔬", "color": "#2f9e44", "range": "2~3단원 (과학 38~83쪽, 실험관찰 20~51쪽)"}, "units": [{"no": 2, "name": "생물과 환경", "cards": [{"title": "생태계란?", "points": ["<b>생태계</b>: 한 지역에서 서로 영향을 주고받는 <b>생물 요소</b>와 <b>비생물 요소</b>를 통틀어 이르는 말", "지구에는 <b>숲, 강, 바다</b> 등 여러 종류의 생태계가 있어요.", "생태계의 크기는 <b>쓰러진 나무 아래 공간</b>처럼 작을 수도, <b>섬</b>처럼 클 수도 있어요.", "종류와 크기는 달라도 모든 생태계는 생물이 살아가는 데 중요해요."], "ox": [["연못이나 화단처럼 작은 곳은 생태계라고 할 수 없다.", false, "작은 생태계도 있어요."], ["생태계의 구성 요소는 서로 영향을 주고받는다.", true, ""]], "tip": null}, {"title": "생물 요소와 비생물 요소", "points": ["<b>생물 요소</b>: 살아 있는 것 → 식물, 동물, <b>버섯, 곰팡이, 세균</b>", "<b>비생물 요소</b>: 살아 있지 않은 것 → <b>햇빛, 물, 공기, 흙, 온도</b>", "헷갈리기 쉬운 것: 버섯·곰팡이는 <b>생물</b>, 흙·공기는 <b>비생물</b>"], "ox": [["곰팡이는 비생물 요소이다.", false, "곰팡이는 살아 있는 생물 요소예요."], ["햇빛과 물은 비생물 요소이다.", true, ""]], "tip": null}, {"title": "생산자·소비자·분해자", "points": ["생물 요소를 <b>양분을 얻는 방법</b>에 따라 나눠요.", "<b>생산자</b>: 햇빛 등을 이용해 <b>스스로 양분을 만드는</b> 생물 → 식물(괭이밥, 개망초, 벼, 부들, 상수리나무)", "<b>소비자</b>: 다른 생물을 <b>먹이로 하여</b> 살아가는 생물 → 동물(박새, 애벌레, 메뚜기, 개구리, 뱀, 매)", "<b>분해자</b>: 주로 <b>죽은 생물체나 배출물을 분해</b>해 양분을 얻고, 다른 생물이 이용할 수 있게 하는 생물 → <b>버섯, 곰팡이, 일부 세균</b>", "분해자가 사라지면 죽은 생물과 배출물이 분해되지 않고 쌓여요."], "ox": [["버섯은 분해자이다.", true, ""], ["옥수수는 다른 생물을 먹고 사는 소비자이다.", false, "스스로 양분을 만드는 생산자예요."], ["분해자는 죽은 생물을 분해하여 양분을 얻는다.", true, ""]], "tip": "“만드는 생산자, 먹는 소비자, 분해하는 분해자”"}, {"title": "먹이사슬과 먹이그물", "points": ["<b>먹이 관계</b>: 생물들 사이의 먹고 먹히는 관계", "<b>먹이사슬</b>: 생물이 서로 먹고 먹히는 관계가 <b>사슬처럼 연결</b>된 것 → 풀 → 메뚜기 → 개구리", "화살표는 “먹히는 생물 → 먹는 생물” 방향! 먹이 관계는 <b>생산자부터</b> 시작해요.", "<b>먹이그물</b>: 여러 개의 먹이사슬이 <b>그물처럼 복잡하게 얽혀</b> 있는 것 (예: 오리는 메뚜기도, 개구리도 먹고 매·족제비에게 먹힘)", "먹이그물이 복잡하면 어떤 생물이 사라져도 <b>또 다른 먹이를 먹고 살아갈 수 있어</b> 환경 변화의 영향을 적게 받고 생태계가 <b>안정적으로 유지</b>돼요."], "ox": [["먹이사슬은 “매 → 뱀 → 개구리”처럼 먹는 생물에서 먹히는 생물 쪽으로 화살표를 그린다.", false, "먹히는 생물 → 먹는 생물 방향이에요."], ["먹이그물은 여러 먹이사슬이 얽혀 있는 것이다.", true, ""]], "tip": null}, {"title": "인간 활동과 환경오염", "points": ["<b>환경오염</b>: 인간의 활동으로 환경이 더러워지거나 훼손되는 현상 → <b>대기오염, 수질오염, 토양오염</b>", "원인: 자동차·공장의 <b>매연</b>, 가정의 <b>생활 하수</b>, 공장 <b>폐수</b>, <b>기름 유출</b>, <b>농약</b>의 지나친 사용, <b>쓰레기</b>, <b>플라스틱</b>의 과도한 사용", "영향: 생물의 <b>서식지</b>(생물이 자리 잡고 사는 곳)가 파괴되고, 생물의 종류와 수가 줄거나 사라질 수 있어요.", "플라스틱: 썩는 데 오래 걸려 서식지 파괴(토양오염), 태울 때 해로운 물질(대기오염), <b>미세 플라스틱</b>(5mm 이하)이 물속 생물에 피해(수질오염)", "사람을 포함한 모든 생물은 생태계의 일부예요. 바다거북이 플라스틱 쓰레기를 먹고 죽기도 해요."], "ox": [["사람은 생태계의 일부가 아니다.", false, "사람을 포함한 모든 생물이 생태계의 일부예요."], ["공장의 폐수는 수질오염의 원인이다.", true, ""], ["미세 플라스틱은 물에 사는 생물에게 피해를 준다.", true, ""]], "tip": null}, {"title": "생태계 보전을 위한 노력", "points": ["국가·사회: 동물이 이동할 수 있도록 <b>생태 통로</b> 만들기, <b>생태계 보호 구역</b>이나 기간 정하기", "물고기가 이동하기 어려운 곳에 <b>물고기 통로</b> 만들기, 투명 방음벽에 <b>새 충돌 방지 스티커</b> 붙이기", "우리: <b>일회용품 사용 줄이기</b>, <b>에너지 절약</b>, 쓰레기 줄이기, 건의하는 글 쓰기, 야생 동물 보호 캠페인"], "ox": [["일회용품 사용을 줄이면 생태계를 보전하는 데 도움이 된다.", true, ""], ["투명 방음벽에 스티커를 붙이는 것은 새의 충돌을 막기 위해서이다.", true, ""]], "tip": null}]}, {"no": 3, "name": "여러 가지 기체", "cards": [{"title": "기체도 무게가 있어요", "points": ["공기 주입 마개로 페트병에 공기를 더 넣으면 <b>무게가 늘어나요</b>.", "공기를 빼는 장치로 용기 안의 공기를 빼면 <b>무게가 줄어들어요</b>.", "→ 공기와 같은 기체는 대부분 눈에 보이지 않고 손으로 잡을 수 없지만 <b>무게가 있어요</b>.", "교실 안 공기의 무게는 약 <b>200kg</b>(피아노 무게와 비슷)! 바람 빠진 농구공에 공기를 넣으면 무게가 늘어나요."], "ox": [["공기는 보이지 않으므로 무게가 없다.", false, "공기도 무게가 있어요."], ["바람 빠진 농구공에 공기를 더 넣으면 농구공의 무게는 늘어난다.", true, ""]], "tip": null}, {"title": "온도에 따른 기체의 부피", "points": ["<b>기체의 부피</b>: 기체가 차지하는 공간의 크기", "실험: <b>집기병</b> 입구에 고무풍선을 씌우고 → <b>뜨거운 물</b>에 넣으면 풍선이 부풀고, <b>얼음물</b>에 넣으면 오그라들어요.", "<b>온도가 높아지면</b> 기체의 부피가 <b>늘어나고</b>, <b>온도가 낮아지면</b> <b>줄어들어요</b>.", "생활 예: 찌그러진 탁구공을 <b>뜨거운 물</b>에 넣으면 펴짐 / 물이 조금 남은 페트병을 <b>냉장고</b>에 넣으면 찌그러짐 / 찌그러진 페트병을 따뜻한 물에 넣으면 펴짐 / 추운 밖의 풍선을 따뜻한 집에 가져오면 커짐"], "ox": [["찌그러진 탁구공을 얼음물에 넣으면 다시 펴진다.", false, "뜨거운 물에 넣어야 펴져요."], ["물이 조금 남은 페트병을 냉장고에 넣으면 페트병 속 기체의 부피가 줄어든다.", true, ""]], "tip": "“뜨거우면 커지고, 차가우면 작아진다”"}, {"title": "압력에 따른 기체의 부피", "points": ["<b>압력</b>: 물체를 누르는 힘. 공기가 든 공을 누르면 공 속 기체의 압력이 변해 크기가 달라져요.", "<b>압력이 높아지면</b> 기체의 부피가 <b>줄어들어요</b>. → 주사기 입구를 막고 피스톤을 누르면 공기의 부피가 줄어요.", "<b>압력이 낮아지면</b> 기체의 부피가 <b>늘어나요</b>. → 공기를 빼는 장치로 용기 안 공기를 빼면 풍선이 <b>커져요</b>(풍선에 가하는 압력이 낮아짐).", "생활 예: <b>높은 산 정상</b>에서 과자 봉지가 부풀어 오름(압력이 낮음) / 발로 세게 찬 축구공이 찌그러짐 / 공을 누르면 작아짐"], "ox": [["높은 산 정상에서 과자 봉지가 부풀어 오르는 것은 압력이 낮아졌기 때문이다.", true, ""], ["주사기 피스톤을 세게 누르면 주사기 속 공기의 부피가 늘어난다.", false, "압력이 높아지면 부피가 줄어요."]], "tip": "온도와 헷갈리지 않기! “누르면(압력↑) 작아지고, 덜 누르면(압력↓) 커진다”"}, {"title": "산소와 이산화 탄소", "points": ["공기에는 <b>산소, 질소, 이산화 탄소</b> 등 여러 가지 기체가 섞여 있어요.", "<b>산소</b>: 우리가 <b>숨을 쉬는 데</b> 꼭 필요, 다른 물질이 <b>타는 것을 돕는</b> 성질 → 휴대용 산소통, 고압 산소 치료 장치, 어항 속 산소 발생기", "<b>이산화 탄소</b>: <b>탄산음료</b> 속에 녹아 톡 쏘는 느낌 / 공기보다 <b>아래로 가라앉는</b> 성질이 있어 불이 났을 때 공기를 차단해 불을 끄는 <b>소화기</b>에 이용"], "ox": [["이산화 탄소는 소화기에 이   d.units.forEach(u => {
    let done = u.cards.filter((c,i) => S.cards[sid+'-'+u.no+'-'+i]).length;
    const nox = u.cards.reduce((a,c)=>a+c.ox.length,0);
    const best = S.ox[sid+'-'+u.no];
    h += `<div class="panel unit"><h3>${u.no}단원 · ${u.name}</h3>
      <div class="bar"><i style="width:${done/u.cards.length*100}%;background:${d.s.color}"></i></div>
      <div class="row" style="margin-top:10px">
      <button class="btn p" style="background:${d.s.color}" onclick="cardsPage('${sid}',${u.no},0)">📖 개념 카드 ${done}/${u.cards.length}</button>
      <button class="btn" onclick="oxQuiz('${sid}',${u.no})">⭕❌ 단원 OX 퀴즈 (${nox}문제)${best!=null?' <span class="badge">최고 '+best+'</span>':''}</button></div></div>`;
  });
  h += `<div class="panel"><h3 style="margin:0 0 8px">✏️ 모의고사 (20문항 · 각 5점)</h3><div class="row">`;
  [1,2,3].forEach(v => { const b = S.exam[sid+'-'+v]; h += `<button class="btn p" style="background:${d.s.color}" onclick="examPage('${sid}',${v})">${v}회${b!=null?' <span class="badge" style="color:#222">'+b+'점</span>':''}</button>`; });
  h += `</div><div class="small" style="margin-top:6px">인쇄해서 풀고 싶으면 '시험지(인쇄용)' 폴더의 PDF를 쓰세요. 같은 문제예요.</div></div>`;
  app.innerHTML = h; window.scrollTo(0,0);
}

// ---------------- 화면: 개념 카드
function cardsPage(sid, uno, idx){
  const d = sub(sid); const u = d.units.find(x => x.no === uno); const c = u.cards[idx];
  const key = sid+'-'+uno+'-'+idx;
  let h = `<button class="back" onclick="subjectPage('${sid}')">← ${d.s.name} 단원 목록</button>
  <div class="small">${uno}단원 ${u.name} · ${idx+1}/${u.cards.length}</div>
  <div class="card" style="border-color:${d.s.color}"><h2>${c.title}</h2><ul>${c.points.map(p=>'<li>'+p+'</li>').join('')}</ul>
  ${c.tip?'<div class="tip">💡 '+c.tip+'</div>':''}`;
  if (c.ox.length){
    h += `<div class="ox"><b>바로 확인! O일까 X일까?</b>`;
    c.ox.forEach((o,k) => { h += `<div class="oxq"><div>${k+1}. ${o[0]}</div><div class="oxb"><button class="btn" onclick="oxAns(this,${o[1]},${k},'${key}')">⭕</button><button class="btn" onclick="oxAns(this,${!o[1]},${k},'${key}')">❌</button></div><div class="fb" id="fb-${k}"></div><div class="small" hidden id="ex-${k}">${o[2]||''}</div></div>`; });
    h += `</div>`;
  }
  h += `</div><div class="dots">${u.cards.map((x,i)=>`<i class="${i===idx?'on':(S.cards[sid+'-'+uno+'-'+i]?'done':'')}"></i>`).join('')}</div>
  <div class="nav"><button class="btn" ${idx===0?'disabled':''} onclick="cardsPage('${sid}',${uno},${idx-1})">← 이전</button>
  ${idx<u.cards.length-1?`<button class="btn p" style="background:${d.s.color}" onclick="markCard('${key}');cardsPage('${sid}',${uno},${idx+1})">다 읽었어요 → 다음</button>`
   :`<button class="btn p" style="background:${d.s.color}" onclick="markCard('${key}');oxQuiz('${sid}',${uno})">다 읽었어요 → 단원 OX 퀴즈</button>`}</div>`;
  app.innerHTML = h; window.scrollTo(0,0);
}
function markCard(k){ S.cards[k] = true; save(); }
function oxAns(btn, right, k){
  const fb = document.getElementById('fb-'+k);
  fb.className = 'fb ' + (right ? 'ok' : 'no');
  fb.textContent = right ? '정답! 👍' : '아쉬워요, 다시 생각해 봐요.';
  document.getElementById('ex-'+k).hidden = false;
}

// ---------------- 단원 OX 퀴즈
let QZ = null;
function oxQuiz(sid, uno){
  const u = sub(sid).units.find(x => x.no === uno);
  const items = []; u.cards.forEach(c => c.ox.forEach(o => items.push(o)));
  QZ = {sid, uno, items: shuffle(items), i:0, score:0};
  oxStep();
}
function oxStep(){
  const d = sub(QZ.sid);
  if (QZ.i >= QZ.items.length){
    const sc = Math.round(QZ.score / QZ.items.length * 100);
    const k = QZ.sid+'-'+QZ.uno; if (S.ox[k]==null || sc > S.ox[k]) { S.ox[k] = sc; save(); }
    app.innerHTML = `<button class="back" onclick="subjectPage('${QZ.sid}')">← 단원 목록</button><div class="card center"><h2>단원 OX 퀴즈 끝!</h2>
      <div class="score">${QZ.score} / ${QZ.items.length}</div><p>${sc>=90?'완벽해요! 🎉 이제 모의고사에 도전!':'틀린 내용은 개념 카드로 한 번 더 보고 다시 풀어 봐요.'}</p>
      <div class="row" style="justify-content:center"><button class="btn" onclick="oxQuiz('${QZ.sid}',${QZ.uno})">다시 풀기</button><button class="btn p" onclick="cardsPage('${QZ.sid}',${QZ.uno},0)">개념 카드 보기</button></div></div>`;
    return;
  }
  const o = QZ.items[QZ.i];
  app.innerHTML = `<button class="back" onclick="subjectPage('${QZ.sid}')">← 그만하기</button>
  <div class="small">${d.s.name} ${QZ.uno}단원 OX · ${QZ.i+1}/${QZ.items.length} · 맞힌 개수 ${QZ.score}</div>
  <div class="card" style="border-color:${d.s.color}"><h2 style="font-size:20px">${o[0]}</h2>
  <div class="oxb" style="justify-content:center;margin-top:24px"><button class="btn" style="flex:0 0 100px;font-size:34px" onclick="oxPick(true)">⭕</button><button class="btn" style="flex:0 0 100px;font-size:34px" onclick="oxPick(false)">❌</button></div>
  <div id="oxr" class="center"></div></div>`;
}
function oxPick(v){
  const o = QZ.items[QZ.i]; const ok = (v === o[1]);
  if (ok) QZ.score++;
  document.querySelectorAll('.oxb button').forEach(b => b.disabled = true);
  $('#oxr').innerHTML = `<div class="fb ${ok?'ok':'no'}" style="font-size:22px;margin-top:14px">${ok?'정답! 👍':'틀렸어요 — 정답은 '+(o[1]?'⭕':'❌')}</div><p>${o[2]||''}</p><button class="btn p" onclick="QZ.i++;oxStep()">다음 →</button>`;
}

// ---------------- 채점 도우미
function norm(s){ return String(s).trim().replace(/<[^>]+>/g,'').replace(/\s+/g,'').replace(/[,，、·ㆍ]/g,'').replace(/[.。]$/,'').replace(/[()（）]/g,''); }
const SYM = /^[ㄱ-ㅎ㉠-㉭]+$/;
function checkSA(q, val){
  let v = norm(val);
  if (!v) return false;
  return q.a.some(a => {
    let n = norm(a);
    if (v === n) return true;
    if (q.suf && v === n + norm(q.suf)) return true;
    if (q.suf && v.endsWith(norm(q.suf)) && v.slice(0, -norm(q.suf).length) === n) return true;
    if (SYM.test(v) && SYM.test(n)) return v.split('').sort().join('') === n.split('').sort().join('');
    if (!isNaN(parseFloat(v)) && !isNaN(parseFloat(n)) && /^[0-9.]+$/.test(v) && /^[0-9.]+$/.test(n)) return parseFloat(v) === parseFloat(n);
    return false;
  });
}
function qHTML(q, n, id){
  let h = `<div class="qt">${n}. ${q.q}${q.t==='es'?'<span class="tag">서술형</span>':''}</div>`;
  if (q.box) h += `<div class="box">${q.box}</div>`;
  if (q.fig) h += `<div class="fig">${q.fig}</div>`;
  if (q.t === 'mc'){
    h += `<div class="ch">` + q.ch.map((c,k)=>`<label id="l-${id}-${k}"><input type="${q.multi?'checkbox':'radio'}" name="q-${id}" value="${k+1}" onchange="selMark('${id}')"><span>${CIRC[k]} ${c}</span></label>`).join('') + `</div>`;
    if (q.multi) h += `<div class="small">답을 모두 고르세요.</div>`;
  } else if (q.t === 'sa'){
    h += `<input class="t" id="i-${id}" placeholder="답을 쓰세요${q.suf?' (단위: '+q.suf+')':''}" autocomplete="off">`;
  } else {
    h += `<textarea id="i-${id}" rows="3" placeholder="문장으로 써 보세요"></textarea>`;
  }
  return h + `<div id="r-${id}"></div>`;
}
function selMark(id){ document.querySelectorAll(`[id^="l-${id}-"]`).forEach(l => l.classList.toggle('sel', l.querySelector('input').checked)); }
function mcVal(id){ return [...document.querySelectorAll(`input[name="q-${id}"]:checked`)].map(x=>+x.value).sort(); }
function gradeOne(q, id){
  if (q.t === 'mc'){
    const v = mcVal(id); const ans = q.multi ? q.a.slice().sort() : [q.a];
    return v.length === ans.length && v.every((x,i)=>x===ans[i]);
  }
  if (q.t === 'sa') return checkSA(q, document.getElementById('i-'+id).value);
  return null; // 서술형: 스스로 채점
}
function ansText(q){
  if (q.t === 'mc') return (q.multi ? q.a : [q.a]).map(x=>CIRC[x-1]).join(', ');
  const a = q.a[0]; return (q.t==='sa' && q.suf && !a.endsWith(q.suf)) ? a + q.suf : a;
}

// ---------------- 모의고사
let EX = null;
function examPage(sid, v){
  const d = sub(sid); const qs = d.exams[v];
  EX = {sid, v, qs, done:false, es:{}};
  let h = `<button class="back" onclick="subjectPage('${sid}')">← ${d.s.name}</button>
  <header class="top"><h1 style="color:${d.s.color}">${d.s.name} 모의고사 ${v}회</h1></header>
  <div class="small">20문항 · 각 5점 · 시간 40분 정도로 풀어 보세요. 다 풀면 맨 아래 [채점하기]를 누르세요.</div>`;
  const seen = {};
  qs.forEach((q, i) => {
    if (q.pas && !seen[q.pas]){ seen[q.pas]=1; const p = d.passages[q.pas]; const nums = qs.map((x,j)=>x.pas===q.pas?j+1:null).filter(x=>x); h += `<div class="pas"><div class="pt">[${nums[0]}~${nums[nums.length-1]}] ${p.title}</div>${esc(p.text)}</div>`; }
    h += `<div class="q" id="q-${i}">${qHTML(q, i+1, i)}</div>`;
  });
  h += `<div class="sticky center" id="exbar"><button class="btn p" style="font-size:19px;padding:12px 30px;background:${d.s.color}" onclick="gradeExam()">채점하기</button></div>`;
  app.innerHTML = h; window.scrollTo(0,0);
}
function gradeExam(){
  if (EX.done) return;
  const blank = EX.qs.filter((q,i)=> q.t==='mc' ? !mcVal(i).length : !document.getElementById('i-'+i).value.trim()).length;
  if (blank && !EX.warned){ EX.warned = true; $('#exbar').insertAdjacentHTML('afterbegin', `<div class="fb no">아직 안 푼 문제가 ${blank}개 있어요. 그래도 채점하려면 한 번 더 누르세요.</div>`); return; }
  EX.done = true;
  EX.qs.forEach((q,i) => {
    const r = gradeOne(q, i); const box = document.getElementById('q-'+i);
    document.querySelectorAll(`#q-${i} input, #q-${i} textarea`).forEach(x=>x.disabled=true);
    if (q.t==='mc') (q.multi?q.a:[q.a]).forEach(a=>document.getElementById(`l-${i}-${a-1}`).classList.add('ans'));
    let msg;
    if (r === null){
      msg = `<div class="res"><b>예시 답:</b> ${q.a[0]}<br><span class="small">${q.exp||''}</span><div class="row" style="margin-top:6px"><b>내 답과 뜻이 같나요?</b><button class="btn s" onclick="esMark(${i},true)">맞았어요</button><button class="btn s" onclick="esMark(${i},false)">틀렸어요</button></div></div>`;
    } else {
      box.classList.add(r ? 'right' : 'wrong'); EX.es[i] = r;
      msg = `<div class="res"><b class="${r?'':'fb no'}">${r?'⭕ 정답':'❌ 오답 — 정답: '+ansText(q)}</b>${q.exp?'<br><span class="small">'+q.exp+'</span>':''}</div>`;
    }
    document.getElementById('r-'+i).innerHTML = msg;
  });
  updateScore();
}
function esMark(i, ok){ EX.es[i] = ok; const b = document.getElementById('q-'+i); b.classList.remove('right','wrong'); b.classList.add(ok?'right':'wrong'); updateScore(); }
function updateScore(){
  const pending = EX.qs.filter((q,i)=>EX.es[i]===undefined).length;
  const right = Object.values(EX.es).filter(x=>x).length;
  const sc = right*5;
  const d = sub(EX.sid);
  $('#exbar').innerHTML = pending ? `<div class="fb">서술형 ${pending}문제는 예시 답을 보고 직접 맞았는지 눌러 주세요. (지금까지 ${sc}점)</div>`
    : `<div class="score">${sc}점</div><div class="row" style="justify-content:center"><button class="btn" onclick="examPage('${EX.sid}',${EX.v})">다시 풀기</button><button class="btn p" onclick="subjectPage('${EX.sid}')">과목으로</button><button class="btn" onclick="wrongPage('${EX.sid}')">오답 노트</button></div>`;
  if (!pending){
    const k = EX.sid+'-'+EX.v; if (S.exam[k]==null || sc > S.exam[k]) S.exam[k] = sc;
    const w = new Set(S.wrong[EX.sid] || []);
    EX.qs.forEach((q,i)=>{ const id = EX.v+'-'+i; if (EX.es[i]) w.delete(id); else w.add(id); });
    S.wrong[EX.sid] = [...w]; save();
  }
}

// ---------------- 오답 노트
function wrongPage(only){
  let h = `<button class="back" onclick="home()">← 처음으로</button><header class="top"><h1>📝 오답 노트</h1></header>
  <div class="small">모의고사에서 틀린 문제예요. 다시 풀어서 맞히면 목록에서 빠져요.</div>`;
  let any = false;
  DATA.forEach(d => {
    if (only && d.s.id !== only) return;
    const list = (S.wrong[d.s.id] || []).slice().sort();
    if (!list.length) return; any = true;
    h += `<h2 style="color:${d.s.color}">${d.s.icon} ${d.s.name} (${list.length})</h2>`;
    list.forEach(id => {
      const [v,i] = id.split('-').map(Number); const q = d.exams[v][i]; if (!q) return;
      const wid = d.s.id+'_'+v+'_'+i;
      const p = q.pas ? `<div class="pas"><div class="pt">${d.passages[q.pas].title}</div>${esc(d.passages[q.pas].text)}</div>` : '';
      h += `<div class="q" id="q-${wid}"><div class="small">${v}회 ${i+1}번 · ${q.u}단원</div>${p}${qHTML(q, '', wid)}
      <button class="btn s p" style="margin-top:6px" onclick="retry('${d.s.id}',${v},${i})">확인</button></div>`;
    });
  });
  if (!any) h += `<div class="panel center">틀린 문제가 없어요! 🎉<br><span class="small">모의고사를 풀면 틀린 문제가 여기에 모여요.</span></div>`;
  app.innerHTML = h; window.scrollTo(0,0);
}
function retry(sid, v, i){
  const d = sub(sid); const q = d.exams[v][i]; const wid = sid+'_'+v+'_'+i;
  const r = document.getElementById('r-'+wid);
  if (q.t === 'es'){
    r.innerHTML = `<div class="res"><b>예시 답:</b> ${q.a[0]}<div class="row" style="margin-top:6px"><button class="btn s" onclick="clearWrong('${sid}',${v},${i})">맞았어요(목록에서 빼기)</button></div></div>`; return;
  }
  const ok = gradeOne(q, wid);
  r.innerHTML = `<div class="res"><b>${ok?'⭕ 정답! 오답 노트에서 뺐어요.':'❌ 다시 생각해 봐요. 정답: '+ansText(q)}</b><br><span class="small">${q.exp||''}</span></div>`;
  if (ok) clearWrong(sid, v, i, true);
}
function clearWrong(sid, v, i, keepView){
  S.wrong[sid] = (S.wrong[sid]||[]).filter(x => x !== v+'-'+i); save();
  if (!keepView) wrongPage();
}
home();
</script>
